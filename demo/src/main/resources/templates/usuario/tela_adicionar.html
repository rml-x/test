<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adicionar usuario</title>


<style>
        /* Configurações Gerais - Padronizado */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .titulo {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        /* Card do Formulário */
        .form-card {
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 1fr 1fr; /* Divide em duas colunas */
            gap: 15px;
        }

        /* Faz campos importantes ocuparem a linha inteira */
        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: bold;
            color: #2c3e50;
            font-size: 0.9em;
            text-transform: capitalize;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 15px;
        }

        input:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        /* Estilização do Botão (Verde para Adicionar) */
        .botao-container {
            grid-column: span 2;
            margin-top: 10px;
        }

        .botao {
            width: 100%;
            background-color: #27ae60;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .botao:hover {
            background-color: #219150;
        }

        /* Link de Voltar */
        .link-voltar {
            margin-top: 20px;
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
        }

        .link-voltar:hover {
            text-decoration: underline;
        }

   
        @media (max-width: 2000px) {
            .form-card {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: span 1;
            }
            .botao-container {
                grid-column: span 1;
            }
        }


        a[href^="/"] {
        color: #04141f;
        text-decoration: none;
        margin-right: 15px;
        font-weight: 500;
    }

    a[href^="/"]:hover { text-decoration: underline; }
    </style>

    function preenche_radio(){
        var turno = "{{usuario.turno}}";
        document.getElementById(turno).checked = true;
        // alert(turno); 
    }
</script> -->
</head>
<body>

<h1 class="titulo">Adicionar usuario</h1>

<form class="form-card" action="/usuario/tela_adicionar" method="post">

<label>Data Nascimento</label>
<input type="date" name="data_nascimento" required>

<label>Nome</label>
<input type="text" name="nome" required>

<label>Senha</label>
<input type="password" name="senha">

<label>cpf</label>
<input type="text" name="cpf" required>

<label>email</label>
<input type="text" name="email" required>

<label>cep</label>
<input type="text" name="cep">

<label>rua</label>
<input type="text" name="rua">

<label>nro</label>
<input type="text" name="nro">

<label>complemento</label>
<input type="text" name="complemento">



<input class="botao" type="submit" value="Adicionar">

</form>

<a href="/usuarios">voltar</a>
</body>
</html>
