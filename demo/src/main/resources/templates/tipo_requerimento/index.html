
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Tipos de Requerimento</title>


<style>
        /* Configurações Gerais - Padronizado com o sistema */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px;
        }

        .titulo {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        /* Botão Adicionar */
        .botao-adicionar {
            display: inline-block;
            background-color: #27ae60;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
            margin-bottom: 20px;
        }

        .botao-adicionar:hover {
            background-color: #219150;
        }

        /* Grid de Cards */
        .lista-tipos {
            list-style: none;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px; /* Espaçamento entre cards */
        }

        /* Card do Tipo de Requerimento */
        .lista-tipos li {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .lista-tipos li:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        /* Conteúdo do Card */
        .badge {
            background: #3498db;
            color: white;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .descricao {
            display: block;
            font-size: 1.2em;
            font-weight: bold;
            color: #2c3e50;
            margin: 15px 0;
            line-height: 1.4;
        }

        /* Botões de Ação */
        .acoes {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-excluir, .btn-alterar {
            flex: 1;
            padding: 8px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.9em;
            text-align: center;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .btn-excluir {
            background-color: #e74c3c;
            color: white;
        }

        .btn-alterar {
            background-color: #f39c12;
            color: white;
        }

        .btn-excluir:hover, .btn-alterar:hover {
            opacity: 0.85;
        }

        /* Link Voltar */
        .link-voltar {
            display: inline-block;
            margin-top: 30px;
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
        }

        .link-voltar:hover {
            text-decoration: underline;
        }

        a[href^="/"] {
        color: #04141f;
        text-decoration: none;
        margin-right: 15px;
        font-weight: 500;
        }

        a[href^="/"]:hover { text-decoration: underline; }
        
    </style>


</head>
<body>

<h1 class="titulo">Tipos de Requerimento</h1>

<a class="botao-adicionar" href="/tipo_requerimento/tela_adicionar/">+ Adicionar Tipo</a>

<ul class="lista-cursos">
  {{#vetorRequerimento}}
    <li>
        <div>
            <span class="badge">{{id}}</span>
                <br>
            <span class="descricao">{{descricao}}</span>
        </div>

        <a class="btn-excluir" href="/tipo_requerimento/excluir/{{id}}">Excluir</a>
          <a class="btn-alterar" href="/tipo_requerimento/tela_alterar/{{id}}">Alterar</a>

    </li>
    <br>
  {{/vetorRequerimento}}
</ul>

  <a class="link-voltar" href="/">voltar</a>


</body>
</html>
