<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Adicionar Curso</title>


<style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .titulo {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        /* Estilização do Card do Formulário */
        .form-card {
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        /* Labels e Inputs */
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2c3e50;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box; /* Garante que o padding não aumente a largura */
            font-size: 16px;
        }

        input:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        /* Grupo de Radios */
        .radio-group {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            border: 1px solid #eee;
        }

        .radio-group label {
            display: inline-block;
            margin-right: 15px;
            font-weight: normal;
            cursor: pointer;
        }

        .radio-group input[type="radio"] {
            margin-right: 5px;
        }

        /* Botão de Ação (Seguindo o estilo btn-alterar/adicionar) */
        .btn-submit {
            width: 100%;
            background-color: #27ae60; /* Verde para 'Adicionar' */
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: #219150;
        }

        /* Link de Voltar */
        .link-voltar {
            margin-top: 20px;
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
        }

        .link-voltar:hover {
            text-decoration: underline;
        }


         a[href^="/"] {
        color: #04141f;
        text-decoration: none;
        margin-right: 15px;
        font-weight: 500;
    }

    a[href^="/"]:hover { text-decoration: underline; }

    </style>


</head>


<body>

<h1 class="titulo">Adicionar Curso</h1>

<form class="form-card" action="/curso/adicionar" method="post">

<label>Nome</label>
<input type="text" name="nome">

<label>Site</label>
<input type="text" name="site">

<label>Turno</label>
<div class="radio-group">
<label><input type="radio" name="turno" value="DIURNO"> Diurno</label>
<label><input type="radio" name="turno" value="NOTURNO"> Noturno</label>
<label><input type="radio" name="turno" value="VESPERTINO"> Vespertino</label>
</div>

<label>Duração</label>
<input type="number" name="duracao">

<input class="btn-submit" type="submit" value="Adicionar">

</form>


<a href="/curso/return"> voltar </a>

</body>
</html>
