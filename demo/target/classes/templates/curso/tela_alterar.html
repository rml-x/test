<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Alterar Curso</title>
</head>

<body>

<script>
    function preenche_radio(){
        var turno = "{{curso.turno}}";
        document.getElementById(turno).checked = true;
        alert(turno); 
    }
</script>

</head>
<body onload="preenche_radio()">

<h1 class="titulo">Adicionar Curso</h1>

<form class="form-card" action="/curso/tela_alterar" method="post">

<label>Nome</label>
<input type="text" name="nome" value="{{curso.nome}}">

<label>Site</label>
<input type="text" name="site" value="{{curso.site}}">

<label>Turno</label>
<div class="radio-group">
<label><input type="radio" name="turno" value="DIURNO" id="DIURNO"> Diurno</label>
<label><input type="radio" name="turno" value="NOTURNO" id="NOTURNO"> Noturno</label>
<label><input type="radio" name="turno" value="VESPERTINO" id="VESPERTINO"> Vespertino</label>
</div>

<label>Duração</label>
<input type="number" name="duracao" value="{{curso.duracao}}">

<input type="hidden" name="id" value="{{curso.id}}">

<input class="botao" type="submit" value="Alterar">

</form>

</body>
