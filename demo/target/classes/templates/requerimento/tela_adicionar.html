<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir Requerimento</title>

<style>
        /* Configurações Gerais - Padronizado com as outras páginas */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .titulo {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        /* Estilização do Card do Formulário */
        .form-card {
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: bold;
            color: #2c3e50;
            font-size: 0.9em;
        }

        /* Inputs, Select e Textarea padronizados */
        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
            font-family: inherit;
        }

        input[type="file"] {
            padding: 10px 0;
            font-size: 0.9em;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        /* Botão de Ação (Verde para sucesso/abertura) */
        button {
            background-color: #27ae60;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #219150;
        }

        /* Link de Voltar */
        .link-voltar {
            margin-top: 20px;
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
        }

        .link-voltar:hover {
            text-decoration: underline;
        }

        textarea {
            resize: vertical; /* Permite aumentar apenas a altura */
        }

        a[href^="/"] {
        color: #04141f;
        text-decoration: none;
        margin-right: 15px;
        font-weight: 500;
        }

        a[href^="/"]:hover { text-decoration: underline; }

    </style>




</head>
<body>

<h1 class="titulo">Abrir Requerimento</h1>

<form class="form-card" action="/requerimento/adicionar" method="post" enctype="multipart/form-data">

    <div class="form-group">
        <label for="tipo_id">Selecionar Tipo</label>
        <select name="tipo_id" id="tipo_id" required>
            <option value="">-- Selecione um tipo --</option>
            {{#tipos}}
                <option value="{{id}}">{{descricao}}</option>
            {{/tipos}}
        </select>
    </div>

    <div class="form-group">
        <label for="matricula">Inserir Matrícula</label>
        <input type="text" name="matricula" id="matricula" required placeholder="Ex: 20231010">
    </div>

    <div class="form-group">
        <label for="observacao">Observação</label>
        <textarea name="observacao" id="observacao" rows="4" placeholder="Descreva seu pedido..."></textarea>
    </div>

    <div class="form-group">
        <label for="anexo">Anexo (Opcional)</label>
        <input type="file" name="anexo" id="anexo">
    </div>

    <button  class="btn-submit"  type="submit">Salvar Requerimento</button>

</form>

<br>
<a href="/requerimento">Voltar para a lista</a>

</body>
</html>
