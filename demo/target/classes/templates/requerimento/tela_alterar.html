<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Requerimento</title>
   <style>
        /* Configurações Gerais - Padronizado */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .titulo {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 550px;
            text-align: center;
        }

        /* Quadro de Informações do Aluno (Read-only) */
        .info-aluno {
            background-color: #ebf5fb;
            border-left: 5px solid #3498db;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 550px;
            box-sizing: border-box;
            font-size: 0.95em;
            line-height: 1.6;
        }

        .info-aluno strong {
            color: #2c3e50;
        }

        /* Estilização do Card do Formulário */
        .form-card {
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 550px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
            color: #2c3e50;
            font-size: 0.9em;
            margin-bottom: -5px;
        }

        /* Inputs, Select e Textarea padronizados */
        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #f39c12; /* Laranja no foco para edição */
            outline: none;
            box-shadow: 0 0 5px rgba(243, 156, 18, 0.2);
        }

        hr {
            border: 0;
            border-top: 1px solid #eee;
            margin: 10px 0;
        }

        .helper-text {
            font-size: 0.8em;
            color: #7f8c8d;
            margin-top: -10px;
            font-style: italic;
        }

        /* Botão de Ação (Laranja para Alterar) */
        button {
            background-color: #f39c12;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #d35400;
        }

        /* Link de Voltar */
        .link-voltar {
            margin-top: 25px;
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
        }

        .link-voltar:hover {
            text-decoration: underline;


        }


          a[href^="/"] {
        color: #04141f;
        text-decoration: none;
        margin-right: 15px;
        font-weight: 500;
    }

    a[href^="/"]:hover { text-decoration: underline; }
    </style>
</head>
<body>

<h1 class="titulo">Alterar Requerimento #{{requerimento.id}}</h1>

<div class="info-aluno">
    <strong>Aluno:</strong> {{requerimento.aluno.usuario.nome}} <br>
    <strong>Curso:</strong> {{requerimento.aluno.curso.nome}} <br>
    <strong>Status Atual:</strong> {{requerimento.status}}
</div>

<form class="form-card" action="/requerimento/alterar/{{requerimento.id}}" method="post" enctype="multipart/form-data">

    <label>Matrícula (Manual):</label>
    <input type="text" name="matricula" value="{{requerimento.aluno.matricula}}" required>

    <label>Tipo de Requerimento:</label>
    <select name="tipo_id">
        {{#tipos}}
        <option value="{{id}}">{{descricao}}</option>
        {{/tipos}}
    </select>

    <label>Observação:</label>
    <textarea name="observacao" rows="5">{{requerimento.observacao}}</textarea>

    <label>Alterar Status:</label>
    <select name="status">
        <option value="EM ANALISE">Em analise</option>
        <option value="DEFERIDO">Aprovar (Deferir)</option>
        <option value="INDEFERIDO">Reprovar (Indeferir)</option>
    </select>

    <hr>
    <label>Substituir Anexo (Opcional):</label>
    <p style="font-size: 0.8em; color: gray;">Se selecionar um arquivo, o anterior será apagado.</p>
    <input type="file" name="anexo">

    <button type="submit">Salvar Alterações</button>

</form>

<br>
<a href="/requerimento">Voltar</a>

</body>
</html>
